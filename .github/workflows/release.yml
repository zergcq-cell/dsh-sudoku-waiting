name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm and GitHub Releases
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Run logic tests
        run: npm test

      - name: Build the client bundle
        run: npm run build

      - name: Check whether npm already has this version
        id: npm_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "dsh-sudoku-waiting@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm_version.outputs.exists == 'false' && env.NPM_TOKEN != ''
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Explain a skipped npm publish
        if: steps.npm_version.outputs.exists == 'false' && env.NPM_TOKEN == ''
        run: echo "::warning::NPM_TOKEN is not configured; skipped npm publish. The GitHub Release is still created."

      - name: Pack the release tarball
        run: npm pack

      - name: Attach the tarball to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-sudoku-waiting-*.tgz
          generate_release_notes: true
